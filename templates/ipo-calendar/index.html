<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IPO Calendar | BE.IPOWALE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="calendar-wrapper">

    <!-- HEADER -->
    <section class="calendar-header">

        <div>
            <h1>IPO <span>Calendar</span></h1>

            <p>
                NEXT 30 DAYS • OPEN • CLOSE • ALLOTMENT • LISTING
            </p>
        </div>

        <div class="header-stats">

            <div class="stat">
                <strong id="totalEvents">0</strong>
                <small>EVENTS</small>
            </div>

            <div class="stat">
                <strong id="activeDays">0</strong>
                <small>ACTIVE DAYS</small>
            </div>

        </div>

    </section>


    <!-- CALENDAR -->
    <main id="calendar"></main>

</div>

<script src="calendar.js"></script>

</body>
</html>
