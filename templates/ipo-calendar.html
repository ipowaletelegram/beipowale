<script>


/* =========================================================
   GLOBAL DATA
========================================================= */

let ipoData = [];

const IST_TIMEZONE =
    "Asia/Kolkata";


/* =========================================================
   ELEMENTS
========================================================= */

const calendarContainer =
    document.getElementById(
        "calendarContainer"
    );


const activeDaysElement =
    document.getElementById(
        "activeDays"
    );


const totalEventsElement =
    document.getElementById(
        "totalEvents"
    );


/* =========================================================
   LOAD GOOGLE SHEET DATA
   THROUGH FLASK API
========================================================= */

async function loadCalendar() {


    try {


        const response =
            await fetch(
                "/api/ipo-calendar",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Calendar API failed: " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "IPO Calendar Data:",
            data
        );


        if (
            !Array.isArray(data)
        ) {

            throw new Error(
                data.message ||
                data.error ||
                "Invalid calendar data"
            );

        }


        ipoData = data;


        buildCalendar();


    }


    catch (error) {


        console.error(
            "IPO Calendar Error:",
            error
        );


        calendarContainer.innerHTML = `

            <div class="message-box">

                <div class="message-icon">
                    ⚠️
                </div>

                <strong>
                    Unable to load IPO calendar
                </strong>

                <br><br>

                Please try again later.

            </div>

        `;

    }

}


/* =========================================================
   DATE PARSER
========================================================= */

function parseDate(value) {


    if (!value) {

        return null;

    }


    value =
        String(value).trim();


    /* YYYY-MM-DD */

    if (
        /^\d{4}-\d{2}-\d{2}$/
            .test(value)
    ) {

        const [
            year,
            month,
            day
        ] =
            value.split("-")
                .map(Number);


        return new Date(
            year,
            month - 1,
            day
        );

    }


    /* DD MMM YYYY */

    const parsed =
        new Date(value);


    if (
        !isNaN(
            parsed.getTime()
        )
    ) {

        return new Date(
            parsed.getFullYear(),
            parsed.getMonth(),
            parsed.getDate()
        );

    }


    return null;

}


/* =========================================================
   DATE KEY
========================================================= */

function dateKey(date) {


    if (!date) {

        return null;

    }


    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            date.getDate()
        ).padStart(2, "0");


    return `${year}-${month}-${day}`;

}


/* =========================================================
   TODAY
========================================================= */

function getToday() {


    const now =
        new Date();


    return new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
    );

}


/* =========================================================
   ADD DAYS
========================================================= */

function addDays(
    date,
    days
) {


    const result =
        new Date(date);


    result.setDate(
        result.getDate() + days
    );


    return result;

}


/* =========================================================
   DATE LABEL
========================================================= */

function formatDate(
    date
) {


    return date.toLocaleDateString(
        "en-IN",
        {
            weekday: "long",
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


/* =========================================================
   EVENT STATUS
========================================================= */

function getEventForDate(
    ipo,
    date
) {


    const current =
        dateKey(date);


    const open =
        parseDate(
            ipo.open_date
        );


    const close =
        parseDate(
            ipo.close_date
        );


    const allotment =
        parseDate(
            ipo.allotment_date
        );


    const listing =
        parseDate(
            ipo.listing_date
        );


    /* LISTING */

    if (
        listing &&
        current === dateKey(listing)
    ) {

        return {
            label: "LISTING",
            className: "listing"
        };

    }


    /* ALLOTMENT */

    if (
        allotment &&
        current === dateKey(allotment)
    ) {

        return {
            label: "ALLOTMENT",
            className: "allotment"
        };

    }


    /* CLOSE */

    if (
        close &&
        current === dateKey(close)
    ) {

        return {
            label: "CLOSE",
            className: "close"
        };

    }


    /* OPEN */

    if (
        open &&
        current === dateKey(open)
    ) {

        return {
            label: "OPEN",
            className: "open"
        };

    }


    return null;

}


/* =========================================================
   BUILD CALENDAR
========================================================= */

function buildCalendar() {


    calendarContainer.innerHTML =
        "";


    const today =
        getToday();


    /*
       We show dates from TODAY
       to 90 days ahead.
    */

    const dates = {};


    for (
        let i = 0;
        i <= 90;
        i++
    ) {


        const date =
            addDays(
                today,
                i
            );


        const key =
            dateKey(date);


        dates[key] = {

            date: date,

            events: []

        };

    }


    /* =====================================================
       ADD IPO EVENTS
    ===================================================== */

    ipoData.forEach(
        ipo => {


            for (
                const key in dates
            ) {


                const event =
                    getEventForDate(
                        ipo,
                        dates[key].date
                    );


                if (event) {


                    dates[key]
                        .events
                        .push({

                            ipo: ipo,

                            event: event

                        });

                }

            }

        }
    );


    /* =====================================================
       REMOVE EMPTY DATES
    ===================================================== */

    const activeDateKeys =
        Object.keys(
            dates
        )
        .filter(
            key =>
                dates[key]
                    .events
                    .length > 0
        );


    /* =====================================================
       STATS
    ===================================================== */

    activeDaysElement.innerText =
        activeDateKeys.length;


    let totalEvents = 0;


    activeDateKeys.forEach(
        key => {

            totalEvents +=
                dates[key]
                    .events
                    .length;

        }
    );


    totalEventsElement.innerText =
        totalEvents;


    /* =====================================================
       EMPTY STATE
    ===================================================== */

    if (
        activeDateKeys.length === 0
    ) {


        calendarContainer.innerHTML = `

            <div class="message-box">

                <div class="message-icon">
                    📅
                </div>

                <strong>
                    No upcoming IPO events
                </strong>

                <br><br>

                Check back soon for new IPO dates.

            </div>

        `;


        return;

    }


    /* =====================================================
       CREATE DATE CARDS
    ===================================================== */

    activeDateKeys.forEach(
        key => {


            const dayData =
                dates[key];


            const date =
                dayData.date;


            const isToday =
                key ===
                dateKey(today);


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "date-card" +
                (
                    isToday
                        ? " today"
                        : ""
                );


            let rows = "";


            dayData.events.forEach(
                item => {


                    const ipo =
                        item.ipo;


                    const event =
                        item.event;


                    rows += `

                        <div class="ipo-row">


                            <div class="company-area">


                                <span
                                    class="company-name">

                                    ${escapeHTML(
                                        ipo.company
                                    )}

                                </span>


                                <span
                                    class="ipo-type">

                                    ${escapeHTML(
                                        (
                                            ipo.type ||
                                            "MAINBOARD"
                                        ).toUpperCase()
                                    )}

                                </span>


                            </div>


                            <span
                                class="status ${event.className}">

                                • ${event.label}

                            </span>


                        </div>

                    `;


                }
            );


            card.innerHTML = `

                <div class="date-header">


                    <div>


                        ${
                            isToday
                            ?
                            `<span class="today-label">
                                • TODAY
                            </span>`
                            :
                            ""
                        }


                    </div>


                    <div class="date-text">

                        ${formatDate(
                            date
                        )}

                    </div>


                </div>


                ${rows}

            `;


            calendarContainer.appendChild(
                card
            );


        }
    );

}


/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(
    value
) {


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
