<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>IPO Calendar | BE.IPOWALE</title>

<style>

body{

margin:0;

background:#101010;

font-family:Arial;

color:white;

}

.container{

max-width:900px;

margin:auto;

padding:30px;

}

.card{

background:#181818;

border-radius:20px;

padding:20px;

text-align:center;

box-shadow:0 0 30px rgba(255,215,0,.12);

}

img{

width:100%;

border-radius:15px;

}

.message{

padding:70px 30px;

}

h1{

color:#FFD700;

}

p{

color:#ccc;

font-size:18px;

}

.footer{

margin-top:20px;

color:#888;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

{% if show_calendar %}

    {% if image_exists %}

        <img
        src="{{ url_for('static', filename=image) }}?v={{ current_time }}">

    {% else %}

        <div class="message">

            <h1>Today's Calendar</h1>

            <p>

            Calendar is being uploaded.

            Please check again shortly.

            </p>

        </div>

    {% endif %}

{% else %}

<div class="message">

<h1>📅 Today's IPO Calendar</h1>

<p>

Calendar will be available

after <b>06:00 AM IST</b>

</p>

</div>

{% endif %}

<div class="footer">

{{ current_time }}

</div>

</div>

</div>

</body>

</html>
