<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>IPO Calendar | BE.IPOWALE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:
linear-gradient(180deg,#111,#1d1d1d);

color:white;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:30px;

}

.container{

max-width:900px;
width:100%;

}

.header{

text-align:center;
margin-bottom:25px;

}

.logo{

font-size:36px;
font-weight:bold;
color:#FFD700;

}

.subtitle{

color:#bbbbbb;
margin-top:8px;

}

.card{

background:#181818;

border-radius:20px;

padding:20px;

border:1px solid rgba(255,215,0,.15);

box-shadow:0 10px 40px rgba(0,0,0,.4);

}

.calendar{

width:100%;

border-radius:15px;

display:block;

}

.hidden{

padding:70px 30px;

text-align:center;

}

.hidden h2{

color:#FFD700;

font-size:34px;

margin-bottom:15px;

}

.hidden p{

color:#cccccc;

font-size:18px;

line-height:30px;

}

button{

margin-top:20px;

padding:12px 28px;

border:none;

border-radius:10px;

background:#FFD700;

color:#000;

font-size:15px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:translateY(-2px);

}

.footer{

text-align:center;

margin-top:20px;

color:#888;

}

@media(max-width:768px){

.logo{

font-size:28px;

}

.hidden h2{

font-size:26px;

}

.hidden p{

font-size:16px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="logo">
📅 BE.IPOWALE
</div>

<div class="subtitle">

Mainboard IPO Calendar

</div>

</div>

<div class="card">

{% if show_calendar %}

<img
id="calendar"
class="calendar"
src="{{ url_for('static', filename='calendar/latest.jpeg') }}?v={{ timestamp }}">

<center>

<button onclick="refreshCalendar()">

🔄 Refresh

</button>

</center>

{% else %}

<div class="hidden">

<h2>Calendar Not Available</h2>

<p>

Today's IPO Calendar will be available after

<b style="color:#FFD700;">06:00 AM IST</b>

</p>

</div>

{% endif %}

</div>

<div class="footer">

Last Visit :
{{ current_time }}

</div>

</div>

<script>

function refreshCalendar(){

const img=document.getElementById("calendar");

img.src="{{ url_for('static', filename='calendar/latest.jpeg') }}?t="+new Date().getTime();

}

setInterval(function(){

location.reload();

},300000);

</script>

</body>

</html>
